<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Electricity Bill Predictor</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><h1>⚡ Smart Electricity Bill Predictor</h1><p>Cloud-based ML forecast of next month's units and bill</p></header>
<main>
<section class="card"><h2>Inputs</h2>
<div class="grid">
<label>Month (1-12)<input id="month" type="number" min="1" max="12" value="5"></label>
<label>Avg temperature (°C)<input id="avg_temp" type="number" step="0.1" value="33"></label>
<label>Occupants<input id="occupants" type="number" min="1" value="4"></label>
<label>AC hours / month<input id="ac_hours" type="number" step="1" value="120"></label>
<label>Last month units<input id="prev_units" type="number" step="1" value="280"></label>
<label>2 months ago units<input id="prev2_units" type="number" step="1" value="260"></label>
</div>
<button id="go">Predict</button><p id="err" class="err"></p></section>
<section class="card" id="result" hidden><h2>Prediction</h2>
<div class="kpis"><div><span id="units"></span><small>kWh</small></div><div><span id="total"></span><small>Total bill</small></div></div>
<p id="meta" class="muted"></p>
<table><thead><tr><th>Slab</th><th>Units</th><th>Rate</th><th>Cost</th></tr></thead><tbody id="rows"></tbody></table>
<p id="extras" class="muted"></p></section>
<section class="card"><h2>Recent predictions</h2><canvas id="chart" height="120"></canvas></section>
</main>
<script src="/static/app.js"></script></body></html>
